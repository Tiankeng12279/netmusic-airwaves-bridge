[[mods]]
modId="netmusic_airwaves"
version="0.16.1"
displayName="NetMusic Airwaves Bridge"
authors="NetMusic Airwaves Bridge"
description='''NetMusic CD decks, GUIs and a spectrum deck for Create: Airwaves.

The radio deck is GUI-less: right-click loads a CD, an empty-hand click ejects it, and redstone toggles playback through a cabled Airwaves transmitter. Playback order is switchable between sequential, shuffle (random other disc) and single-disc loop. Both decks support shift-eject (carousel) mode: the first slot becomes the input, the last the output, middle slots are locked to automation, and when a disc finishes the queue shifts toward the output - pair it with hoppers to play unlimited discs; shuffle instead plays random middle discs, moving finished ones straight to the output. The playlist player adds an analyzer-style GUI with 16 CD slots, transport controls, lyrics, and a live 20 Hz - 8 kHz spectrum panel. Decks can also act as Create display link sources.'''

